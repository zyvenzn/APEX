name: APEX Validation

on:
  push:
    branches:
      - feat/bonding-curve-graduation-v1
      - fix/phase-00-build-ci-e2e
      - feat/phase-01-backend-foundation
      - feat/phase-02-simulation-ledger
      - feat/phase-03-spot-market-engine
      - feat/phase-03-frontend-ledger-integration
  pull_request:
    branches:
      - feat/bonding-curve-graduation-v1
      - fix/phase-00-build-ci-e2e
      - feat/phase-01-backend-foundation
      - feat/phase-02-simulation-ledger
      - feat/phase-03-spot-market-engine
      - feat/phase-03-frontend-ledger-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build, unit tests and browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://apex:apex_dev_password@localhost:5432/apex
      REDIS_URL: redis://localhost:6379
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apex
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend and backend dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check src/backend-integration.js
          node --check build.js
          node --check src/app.js
          node --check src/market-data/chain-registry.js
          node --check src/market-engine.js
          node --check src/bonding-curve.js
          node --check src/spot-trading-router.js
          node --check src/market-chart.js
          node --check tests/e2e.js

      - name: Build standalone application
        run: npm run build

      - name: Verify committed standalone bundle is current
        run: git diff --exit-code -- index.html

      - name: Run all unit tests
        run: npm test

      - name: Type-check and compile backend
        run: npm run build:api

      - name: Run backend tests
        run: npm run test:api

      - name: Apply database migrations
        run: npm run migrate

      - name: Run PostgreSQL and Redis integration smoke test
        run: npm run test:api:integration

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:e2e
