name: Rebuild standalone bundle and validate audit branch

on:
  push:
    branches:
      - fix/pre-staging-audit-reconciliation-security
      - fix/staging-db-safety-static-build
      - fix/pre-staging-hardening

permissions:
  contents: read

jobs:
  rebuild-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DEPLOYMENT_ENVIRONMENT: test
      DATABASE_URL: postgres://apex:apex_dev_password@localhost:5432/apex
      EXPECTED_DATABASE_NAME: apex
      EXPECTED_DATABASE_USER: apex
      EXPECTED_DATABASE_INSTANCE_ID: 00000000-0000-4000-8000-000000000002
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apex
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproducible dependency install
        run: npm ci --no-audit --no-fund
      - name: Rebuild standalone frontend bundle
        run: |
          node --check src/backend-integration.js
          npm run build
      - name: Verify committed standalone bundle
        run: git diff --exit-code -- index.html
      - name: Frontend unit tests
        run: npm test
      - name: Backend build and tests
        run: |
          npm run build:api
          npm run test:api
      - name: Provision isolated CI database identity marker
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE apex_database_identity (
            singleton boolean PRIMARY KEY DEFAULT TRUE CHECK (singleton),
            environment_name text NOT NULL CHECK (environment_name IN ('development','test','staging','production')),
            instance_id uuid NOT NULL UNIQUE,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          INSERT INTO apex_database_identity (singleton, environment_name, instance_id)
          VALUES (TRUE, 'test', '00000000-0000-4000-8000-000000000002');
          SQL
      - name: Database migrations
        run: npm run migrate
      - name: Database identity guard tests
        run: npm run test:api:identity
      - name: PostgreSQL integration and reconciliation
        run: npm run test:api:integration
      - name: Migration concurrency and lock-release integration test
        run: npm run test:api:migrations
      - name: Browser E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:api:browser
          node tests/backend-config.e2e.js
          npm run test:e2e
