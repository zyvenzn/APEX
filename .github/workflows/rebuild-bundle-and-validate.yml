name: Rebuild standalone bundle and validate audit branch

on:
  push:
    branches:
      - fix/pre-staging-audit-reconciliation-security

permissions:
  contents: write

jobs:
  rebuild-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://apex:apex_dev_password@localhost:5432/apex
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apex
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-staging-audit-reconciliation-security
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproducible dependency install
        run: npm ci --no-audit --no-fund
      - name: Rebuild standalone frontend bundle
        run: |
          node --check src/backend-integration.js
          npm run build
      - name: Commit generated bundle if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate standalone frontend bundle after retry fix"
            git push origin HEAD:fix/pre-staging-audit-reconciliation-security
          fi
      - name: Verify committed bundle
        run: git diff --exit-code -- index.html
      - name: Frontend unit tests
        run: npm test
      - name: Backend build and tests
        run: |
          npm run build:api
          npm run test:api
      - name: Database migrations
        run: npm run migrate
      - name: PostgreSQL integration and reconciliation
        run: npm run test:api:integration
      - name: Browser E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:api:browser
          npm run test:e2e
