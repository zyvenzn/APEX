<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apex Trading Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#060610;--bg2:#0a0a16;--card:#11111c;--card2:#171724;--line:#1c1c2b;--tx:#f3f4fa;--mut:#8b8da6;--mut2:#5a5c74;--acc:#4f5df5;--acc2:#7480ff;--up:#2fe27a;--dn:#ff5a3c;--warn:#ff5722;--r:14px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:var(--acc2);text-decoration:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.dim{color:var(--mut2)}
#app{display:grid;grid-template-columns:236px minmax(0,1fr);max-width:1320px;margin:0 auto;min-height:100vh}
@media(min-width:1180px){#app{grid-template-columns:236px minmax(0,760px) 330px}}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:.2px;padding:0 8px 18px}
.brand img{width:38px;height:38px;border-radius:11px}
.navb{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:12px;color:var(--mut);font-weight:600;width:100%;text-align:left}
.navb:hover{background:var(--card);color:var(--tx)}
.navb.on{background:var(--card2);color:var(--tx)}
.navb img.av{width:22px;height:22px;border-radius:50%}
.side .sp{flex:1}
.mini{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.mini .l{font-size:12px;color:var(--mut)}.mini .v{font-size:24px;font-weight:700;margin:2px 0 10px}
main{min-width:0;padding-bottom:120px}
.page{max-width:760px;margin:0 auto}
.rail{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 18px;border-left:1px solid var(--line);display:none;flex-direction:column;gap:16px}
@media(min-width:1180px){.rail{display:flex}}
.rail h4{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.dock{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:none;justify-content:space-between;padding:6px;border-radius:26px;background:rgba(24,24,36,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.05);max-width:560px;margin:0 auto}
.dock button{flex:1;height:48px;border-radius:22px;display:grid;place-items:center;color:var(--mut)}
.dock button.on{background:rgba(255,255,255,.08);color:#fff}
.dock img{width:26px;height:26px;border-radius:50%}
@media(max-width:820px){#app{grid-template-columns:1fr}.side{display:none}.dock{display:flex}}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px}
.topbar img.lg{width:34px;height:34px;border-radius:10px}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mut);position:relative}
.ibtn:hover{color:#fff;background:var(--card)}
.ibtn .dot{position:absolute;top:6px;right:7px;min-width:16px;height:16px;border-radius:8px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bal{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 16px 14px;gap:12px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}.big .dim{font-weight:600}
.d24{font-size:12px;font-weight:600;margin-top:2px}.d24 .mut{font-weight:500}
.btn{padding:11px 22px;border-radius:12px;font-weight:700;background:var(--card2);transition:.15s}
.btn.pri{background:var(--acc);color:#fff}.btn.pri:hover{background:var(--acc2)}
.btn.sm{padding:7px 12px;border-radius:9px;font-size:13px}
.btn.warn{background:var(--warn);color:#fff;width:100%;padding:15px}
.btn.block{width:100%;padding:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sec{display:flex;align-items:center;gap:8px;padding:8px 16px;font-weight:700;font-size:14px}
.hs{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.wcard{flex:none;min-width:150px;background:var(--card);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:7px;border:1px solid transparent}
.wcard:hover{border-color:var(--line)}
.wcard .n{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}.wcard .p{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;color:var(--up)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 0}
.tabs button{flex:1;padding:13px 4px;color:var(--mut);font-weight:600;text-align:center;position:relative}
.tabs button.on{color:#fff}.tabs button.on::after{content:'';position:absolute;left:12%;right:12%;bottom:-1px;height:2px;background:var(--acc);border-radius:2px}
.tag{font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px;background:#1d2260;color:#8f9bff;margin-left:4px;vertical-align:middle}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;align-items:center}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:9px;color:var(--mut);font-weight:600;font-size:13px;background:transparent;border:1px solid transparent}
.chip:hover{color:#fff}.chip.on{background:var(--card2);color:#fff;border-color:#2a2a3e}
.chip.ic{padding:7px 8px}
.banner{margin:2px 16px 8px;padding:11px 13px;border-radius:12px;background:var(--card);display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mut)}
.banner b{color:var(--acc2);font-weight:600}.banner svg{color:var(--acc2)}
.list{padding:0 8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:12px;cursor:pointer;position:relative}
.row:hover{background:var(--card)}
.row .mid{flex:1;min-width:0}.row .nm{font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12px;color:var(--mut);margin-top:1px}
.row .rt{text-align:right}.row .px{font-weight:700}.row .ch{font-size:11px;font-weight:600;margin-top:1px}
.age{font-size:10px;color:var(--up);font-weight:600}
.flash-up{animation:fu .7s}.flash-dn{animation:fd .7s}
@keyframes fu{from{color:var(--up)}}@keyframes fd{from{color:var(--dn)}}
.ico{width:var(--s,40px);height:var(--s,40px);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:calc(var(--s,40px)*.34);color:#fff;flex:none;position:relative;text-shadow:0 1px 2px rgba(0,0,0,.35);letter-spacing:-.5px}
.ico .vb{position:absolute;right:-2px;bottom:-2px;width:35%;height:35%;border-radius:50%;background:#4f6bff;border:2px solid var(--bg);display:grid;place-items:center}
.ico .vb::after{content:'';width:34%;height:20%;border:solid #fff;border-width:0 0 1.5px 1.5px;transform:rotate(-45deg) translate(5%,-10%)}
.bond{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:10px;color:var(--mut);margin-top:4px}
.bond i{display:block;width:34px;height:3px;border-radius:2px;background:var(--up)}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 30px;color:var(--mut);text-align:center}
.empty img{width:76px;opacity:.25;border-radius:20px;filter:grayscale(1)}
.sw{width:50px;height:30px;border-radius:15px;background:#1e1e2d;position:relative;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#e9eaf5;transition:.2s}
.sw.on{background:var(--acc)}.sw.on::after{left:23px}
.set{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.set .t{font-weight:600;font-size:15px}.set .d{font-size:12px;color:var(--mut);margin-top:2px}
.set .g{flex:1}.set .r{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:4px}
.set .lead{color:#e5e6f2}
.hd{display:flex;align-items:center;gap:10px;padding:14px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.hd h1{margin:0;font-size:16px;font-weight:700;flex:1;text-align:center}.hd .sp{width:38px}
h2.pt{font-size:26px;margin:4px 16px 8px;font-weight:700}
.field{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin:6px 0}
.field:focus-within{border-color:var(--acc)}
.field input,.field textarea{flex:1;background:none;border:0;outline:0;padding:14px 0;min-width:0;width:100%;resize:none}
.lbl{font-size:11px;color:var(--mut);margin:14px 0 0}
.pad{padding:0 16px}
.grp{display:flex;gap:8px}.grp>*{flex:1}
.opt{padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;text-align:center;font-size:14px}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fi .18s}
.sheet{background:#101019;width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:su .22s ease-out;border:1px solid var(--line);border-bottom:0}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line);max-height:90vh}}
@keyframes su{from{transform:translateY(40px);opacity:0}}@keyframes fi{from{opacity:0}}
.grab{display:block;width:38px;height:4px;border-radius:2px;background:#2a2a3a;margin:0 auto 12px}
.sheet h3{margin:6px 0 4px;text-align:center;font-size:17px}
.sheet .sd{text-align:center;color:var(--mut);font-size:12px;margin-bottom:14px}
.opr{display:flex;align-items:center;gap:12px;padding:15px;border-radius:14px;background:var(--card);margin-bottom:8px;width:100%;text-align:left}
.opr:hover{background:var(--card2)}.opr .g{flex:1}.opr .t{font-weight:700}.opr .d{font-size:12px;color:var(--mut);margin-top:2px}
.pill{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--acc);color:#fff;margin-left:6px}.pill.g{background:#2a2b3a;color:#c3c5d8}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#23233a;border:1px solid #33334d;padding:11px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:90;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:su .2s}
.toast.err{border-color:#6b2a20;background:#2a1613}
.cta{width:100%;padding:15px;border-radius:13px;font-weight:800;font-size:15px;margin-top:12px;color:#06120a}
.cta.buy{background:var(--up)}.cta.sell{background:var(--dn);color:#fff}.cta.acc{background:var(--acc);color:#fff}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:9px;font-weight:700;color:var(--mut)}
.seg button.on.buy{background:var(--up);color:#06120a}.seg button.on.sell{background:var(--dn);color:#fff}.seg button.on.acc{background:var(--acc);color:#fff}
.q{display:flex;gap:6px;margin-top:8px}.q button{flex:1;padding:9px 4px;border-radius:9px;background:var(--card);font-weight:600;font-size:13px;color:var(--mut)}.q button.on,.q button:hover{color:#fff;background:var(--card2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--card);border-radius:11px;padding:9px 10px}.stats small{display:block;color:var(--mut);font-size:11px}.stats b{font-size:13px}
.spark{height:96px;margin:6px -4px}.spark svg{width:100%;height:100%;display:block}
.err{color:var(--dn);font-size:12px;margin-top:8px;font-weight:600}
.nfo{font-size:12px;color:var(--mut);margin-top:8px;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--acc)}
.sbar{position:sticky;bottom:92px;margin:0 16px;z-index:10}
@media(min-width:821px){.sbar{bottom:20px}}
.sbar .field{background:#1d1d2b;border-radius:24px;padding:0 8px 0 16px;border-color:#262638;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.sbar .field button{background:#2b2b3e;border-radius:14px;padding:6px 12px;font-size:12px;font-weight:700}
.rec{display:flex;justify-content:space-between;padding:6px 16px;color:var(--mut);font-weight:600;font-size:14px;align-items:center}
.rec button{color:var(--acc2);font-size:13px}
.xb{color:var(--mut2);padding:6px}.xb:hover{color:#fff}
.tcard{flex:none;width:150px;background:var(--card);border-radius:14px;padding:12px 10px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.tcard b{font-size:13px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn{background:var(--acc);color:#fff;border-radius:8px;padding:6px;font-weight:700;width:100%;font-size:12px;margin-top:6px}
.fbtn.on{background:#262638;color:#c9cbe0}
.fl{padding:4px 11px;border-radius:7px;background:#232333;font-size:11px;font-weight:700;color:#e4e5f3}
.fl.on{background:transparent;border:1px solid #2f3045;color:var(--mut)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:12px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.fh{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}.fh h2{margin:0;font-size:22px;flex:1}
.tg{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.fi{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:11px;animation:fi .4s;cursor:default}
.fi.new{background:rgba(79,93,245,.08)}
.fi .b{flex:1;min-width:0}.fi .top{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;margin-bottom:6px}
.fi .top .ago{color:var(--mut2);font-weight:500;font-size:12px}
.tp{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px}
.tp.Buy,.tp.long{background:#12331f;color:var(--up)}.tp.Sell,.tp.short,.tp.Liquidated{background:#3a1913;color:var(--dn)}.tp.Opened{background:#1b2260;color:#8f9bff}.tp.Closed,.tp.Reduced{background:#262638;color:#c3c5d8}
.fi .ln{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;cursor:pointer}
.fi .ln small{font-weight:500;color:var(--mut)}
.cardx{background:var(--card);border-radius:14px;padding:12px;margin:6px 0 0}
.pin{margin:0 16px;background:var(--card);border-radius:14px;padding:12px 13px;font-size:13px}
.lbh{position:relative;height:150px;background:linear-gradient(#202078 0%,#0e0e3a 45%,var(--bg) 100%);overflow:hidden}
.lbh h1{position:absolute;left:0;right:0;top:46px;text-align:center;margin:0;font-weight:600;font-size:26px}
.lbh .fa{position:absolute;opacity:.9}
.lbtabs{display:flex;background:var(--bg);border-bottom:1px solid var(--line)}
.lbtabs button{flex:1;padding:12px;color:var(--mut);font-weight:600;position:relative}.lbtabs button.on{color:#fff}.lbtabs button.on::after{content:'';position:absolute;left:15%;right:15%;bottom:-1px;height:2px;background:var(--acc)}
.rng{display:flex;gap:4px;align-items:center;padding:12px 16px}.rng button{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;color:var(--mut2)}.rng button.on{background:#252535;color:#fff}.rng .sp{flex:1}
.me{display:flex;align-items:center;gap:12px;margin:0 16px 8px;padding:14px;background:var(--card);border-radius:14px}
.rk{width:22px;font-size:12px;color:var(--mut);font-weight:700;text-align:left;flex:none}.rk.g{color:#e7b04b}
.pcard{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:10px 12px;margin:6px 0 0 30px;font-size:13px}
.pcard small{display:block;font-size:10px;color:var(--mut2)}
.ban{height:104px;background-size:cover;background-position:center;position:relative}
.ban .ac{position:absolute;top:14px;right:12px;display:flex;gap:4px}.ban .ac .ibtn{background:rgba(0,0,0,.28);color:#fff}
.pav{width:62px;height:62px;border-radius:50%;border:3px solid var(--bg);margin:-30px 0 0 14px;position:relative;background:#222;overflow:hidden;display:block}
.pav img{width:100%;height:100%;object-fit:cover}
.prow{display:flex;justify-content:space-between;align-items:flex-start;padding:0 16px}
.stats2{display:flex;gap:14px;color:var(--mut);font-size:12px;padding:8px 16px 0;flex-wrap:wrap}.stats2 span{display:flex;align-items:center;gap:5px}
.chart{height:130px;margin:6px 0 10px;position:relative;background-image:radial-gradient(#1a1a28 1px,transparent 1px);background-size:9px 9px}.chart svg{width:100%;height:100%;display:block}
.cash{display:flex;align-items:center;gap:12px;margin:0 16px;padding:13px;background:var(--card);border-radius:16px}
.cash .c{width:38px;height:38px;border-radius:50%;background:#222233;display:grid;place-items:center;font-weight:700}
.cash .g{flex:1;font-size:12px;color:var(--mut)}.cash .g b{display:block;font-size:15px;color:#fff}
.sqb{width:38px;height:36px;border-radius:10px;background:#222233;display:grid;place-items:center}
.ph{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 6px;font-weight:700}
.sw2{display:flex;background:var(--card);border-radius:8px;padding:2px;font-size:11px}.sw2 button{padding:3px 9px;border-radius:6px;font-weight:700;color:var(--mut2)}.sw2 button.on{background:#262638;color:#fff}
.rwc{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}.rwc div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12px}.rwc b{display:block;font-size:20px;margin:6px 0 4px}
.lnk{margin:12px 16px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;justify-content:center;gap:10px;align-items:center;color:var(--mut)}.lnk b{color:#fff}
.unc{margin:0 16px;padding:14px;border:1px solid #20202f;border-radius:14px}
.unc .l{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);padding:5px 0}
.faq{padding:15px 16px;border-bottom:1px solid var(--line)}.faq b{display:flex;justify-content:space-between;cursor:pointer}.faq p{margin:8px 0 0;color:var(--mut);font-size:13px}
.login{position:fixed;inset:0;z-index:100;background:radial-gradient(900px 500px at 50% 0,#1b1b50,var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.login img{width:110px;border-radius:28px;box-shadow:0 20px 60px rgba(100,80,255,.3)}
.login h1{margin:6px 0 0;font-size:30px}.login p{margin:0;color:var(--mut);max-width:340px}
.nrow{display:flex;gap:11px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:13px}.nrow.u b{color:#fff}.nrow .d{width:8px;height:8px;border-radius:50%;background:var(--acc);margin-top:5px;flex:none}
.rl{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px}
.rl+.rl{border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.thead{position:sticky;top:0;z-index:8;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 10px 8px}
.tokpg{min-height:100vh;display:flex;flex-direction:column}
main:has(.tokpg){padding-bottom:0}
body.tok .dock{display:none!important}
.tchart{position:relative;height:300px;margin:8px 0 0;background-image:radial-gradient(#171726 1px,transparent 1px);background-size:9px 9px}
.tchart svg{width:100%;height:100%;display:block}
.ptag{position:absolute;right:0;transform:translateY(-50%);padding:3px 9px;border-radius:5px;font-size:12px;font-weight:700;color:#06120a}
.ptag.g{background:var(--up)}.ptag.r{background:var(--dn);color:#fff}
.elab{position:absolute;left:6px;font-size:11px;padding:1px 8px;border:1px solid #3a3a52;border-radius:9px;background:#0b0b16;color:#c9cbe0}
.tfrow{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.tfrow button{padding:5px 10px;border-radius:7px;font-size:13px;font-weight:700;color:var(--mut2);display:flex;align-items:center;gap:4px}
.tfrow button.on{background:#232333;color:#fff}.tfrow button[disabled]{opacity:.35;cursor:not-allowed}
.tfrow .vr{width:1px;height:20px;background:#262636}
.ld{width:5px;height:5px;border-radius:50%;background:var(--acc2);display:inline-block}
.tbar{margin-top:auto;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%);padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:9}
.twarn{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--warn);font-size:13px;margin-bottom:10px}
.twarn b{font-weight:600}
.tbtns{display:flex;gap:10px}
.tb{flex:1;height:58px;border-radius:14px;font-weight:800;font-size:17px;color:#fff}
.tb.sell{background:var(--warn)}.tb.buy{background:var(--acc)}.tb.bolt{flex:none;width:68px;background:#171724;display:grid;place-items:center}
.tb[disabled]{opacity:.4;cursor:not-allowed}
.qt{background:#0d0d17;border-top:1px solid var(--line);margin:0 -14px 0;padding:14px 16px 4px}
.qh{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:12px}
.qh span{display:flex;gap:8px;align-items:center}.qh .gear{color:var(--mut)}
.qr{display:flex;align-items:center;gap:8px;margin-bottom:10px}.qr>b{width:48px;font-size:17px}
.qb{flex:1;height:50px;border-radius:12px;background:#141922;font-weight:800;font-size:17px;color:var(--up)}
.qb.s{background:#1f1517;color:var(--warn)}.qb[disabled]{opacity:.35;cursor:not-allowed}
.qb:active{transform:scale(.97)}
.qf{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:17px;margin:14px 0 12px}.qf .sl{color:#f2c94c;font-weight:700;display:flex;gap:6px;align-items:center}
.qin{flex:1;min-width:0;height:50px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-weight:800;font-size:19px;outline:0}.qin:focus{border-color:var(--acc)}
.trbtn{height:44px;min-width:46px;padding:0 14px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-weight:700}
.trbtn.fl{min-width:104px;font-size:15px;background:var(--acc);color:#fff}.trbtn.fl.on{background:#262638;border:0;color:#c9cbe0}
.trsh{margin:0 -16px}
.trpos{display:flex;align-items:center;gap:10px;margin-top:10px;cursor:pointer}
.trck{width:20px;height:20px;accent-color:var(--acc)}
.sheet.full{height:96vh;height:96dvh;max-height:96dvh}
.sheet.full>#sb{min-height:calc(100% - 20px)}
.trsend{display:flex;flex-direction:column;height:calc(96vh - 56px);height:calc(96dvh - 56px);min-height:480px}
.amtbig{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:52px;font-weight:700}
.amtbig .chip{font-size:14px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);margin-top:6px}
.kp button{height:min(58px,7.5vh);font-size:23px;font-weight:700;border-radius:12px}.kp button:active{background:var(--card2)}
.big.trbig{font-size:clamp(22px,7.4vw,32px);white-space:nowrap}
</style></head>

function tpslSheet(id){const p=S.pos.find(x=>x.uid===id&&x.open);if(!p)return;const t=DB[p.id];UI.tr=null;sheet(`<h3>Take profit / Stop loss</h3><div class="sd">${esc(t.sym)} ${p.lev}x ${p.side} · now ${fmtP(t.p)} · liq. ≈ ${fmtP(liqPx(p.entry,p.lev,p.side,t))}</div><div class="lbl">Take profit price (empty = off)</div><div class="field"><span class="mut">$</span><input id="tpin" inputmode="decimal" value="${p.tp||''}"></div><div class="lbl">Stop loss price (empty = off)</div><div class="field"><span class="mut">$</span><input id="slin" inputmode="decimal" value="${p.sl||''}"></div><div class="err" id="tperr"></div><button class="cta acc" data-act="saveTpsl" data-uid="${p.uid}">Save</button>`)}
function setTpsl(id,tpRaw,slRaw){const p=S.pos.find(x=>x.uid===id&&x.open);if(!p)return 'Position is already closed.';const t=DB[p.id],d=p.side==='long'?1:-1;const rd=r=>String(r).trim()===''?null:parseNum(r);const tp=rd(tpRaw),sl=rd(slRaw);if((tp!==null&&!(tp>0))||(sl!==null&&!(sl>0)))return 'Enter a valid price.';if(tp!==null&&d*(tp-t.p)<=0)return `Take profit must be ${d>0?'above':'below'} the current price.`;if(sl!==null&&d*(t.p-sl)<=0)return `Stop loss must be ${d>0?'below':'above'} the current price.`;if(sl!==null&&d*(sl-liqPx(p.entry,p.lev,p.side,t))<=0)return 'Stop loss is beyond the liquidation price.';p.tp=tp;p.sl=sl;save();return ''}
function checkPerps(){for(const p of S.pos.filter(x=>x.open&&x.kind==='perp')){const t=DB[p.id],d=p.side==='long'?1:-1;const why=isLiq(p)?'liquidated':p.tp&&d*(t.p-p.tp)>=0?'take profit hit':p.sl&&d*(t.p-p.sl)<=0?'stop loss hit':'';if(!why)continue;closePos(p.uid,why==='liquidated'?'Liquidated':'Closed');const msg=`${t.sym} ${p.lev}x position: ${why}`;S.notifs.unshift({t:msg,ts:Date.now(),u:1});toast(msg,why!=='take profit hit');save();retrade();render(true)}}
function followAlert(f){if(!S.nt.enable||S.nt.pause||!S.follows.includes(f.tr))return;const t=DB[f.id];if(!t||f.amt<(t.kind==='perp'?S.nt.perpMin:S.nt.tokMin))return;const msg=`${f.tr}: ${f.type} ${t.sym} ($${abbr(f.amt)})`;S.notifs.unshift({t:msg,ts:Date.now(),u:1});S.notifs=S.notifs.slice(0,20);save();toast(msg)}

}
let tickN=0;
function tick(){tickN++;for(const t of ALL){if(t.dead)continue;const d=(Math.random()-.5)*2*t.vola;t.p=Math.max(t.p*(1+d),1e-12);if(t.kind==='token')t.mc=t.mc0*(t.p/t.p0);t.chg=(t.p/t.base-1)*100;t.h.push(t.p);if(t.h.length>90)t.h.shift()}
checkPerps();recordEquity();saveMkt();
if(!document.hidden){updateDom();if(tickN%4===0){rail();checkLb()}}}
/* ---------- NPC archetypes ---------- */
const ARCH={
whale:{ic:'🐋',lbl:'Whale',n:4,rate:.4,bio:'Size is the edge. Majors and blue chips only.'},
sniper:{ic:'🎯',lbl:'Sniper',n:8,rate:1,bio:'In early at low MC, out between $70K and $100K.'},
fomo:{ic:'🔥',lbl:'FOMO',n:8,rate:1,bio:'Buys what is already green. Panic sells the dip.'},
dev:{ic:'🛠️',lbl:'Dev',n:4,rate:.4,bio:'Building my own token. Holding, mostly.'},
pro:{ic:'📈',lbl:'Pro',n:7,rate:.8,bio:'Sized risk, tight stops, patient exits.'},
copy:{ic:'🪞',lbl:'Copy trader',n:7,rate:1,bio:'Mirroring the leaderboard. Not financial advice.'},
degen:{ic:'🎰',lbl:'Degen',n:9,rate:1.4,bio:'Max leverage or nothing.'},
small:{ic:'🐜',lbl:'Small cap',n:8,rate:1,bio:'Starting small, learning every trade.'},
kol:{ic:'📣',lbl:'KOL',n:4,rate:.35,bio:'Calls, threads and alpha. NFA.'}};
const AO={kv4rl:'whale',thinvalue:'whale',YetzerHaraTrap:'whale','0xForgivable':'whale',ColossalResurrection:'pro',leo:'pro'};
const AR={};{const left=[];for(const k in ARCH)for(let i=0;i<ARCH[k].n;i++)left.push(k);
for(const n in AO){AR[n]=AO[n];left.splice(left.indexOf(AO[n]),1)}
TN.filter(n=>!AR[n]).sort((a,b)=>hash(a)-hash(b)).forEach((n,i)=>AR[n]=left[i%left.length])}
const archOf=n=>AR[n]||'small';
const archIc=n=>ARCH[archOf(n)]&&AR[n]?`<span title="${ARCH[archOf(n)].lbl}" style="font-size:12px">${ARCH[archOf(n)].ic}</span>`:'';
const archTag=n=>AR[n]?`<span class="pill">${ARCH[archOf(n)].ic} ${ARCH[archOf(n)].lbl}</span>`:'';
const NH={},NP={},NC={},CROWD=[];
const nh=n=>NH[n]||(NH[n]={});
const mins=ts=>(Date.now()-ts)/6e4;
const liveTok=()=>ALL.filter(t=>t.kind==='token'&&!t.dead);
const nCount=n=>Object.keys(nh(n)).length;
function nBuy(n,t,usd,note){if(t.p>t.p0*3)return null;usd=Math.min(usd,.07*depth(t));if(!(usd>=3))return null;const k=quoteBuy(t,usd),mcAt=t.mc*k.px/t.p,H=nh(n),h=H[t.id]||(H[t.id]={qty:0,cost:0,mc:0,p0:t.p,ts:Date.now()});
h.mc=(h.mc*h.cost+mcAt*usd)/(h.cost+usd);h.p0=(h.p0*h.cost+t.p*usd)/(h.cost+usd);h.qty+=k.qty;h.cost+=usd;
movePrice(t,k.move);noteTx(t.id,true,usd);return {tr:n,type:'Buy',id:t.id,amt:usd,at:mcAt,ak:'mc',note,ts:Date.now()}}
function nSell(n,id,frac,note){const t=DB[id],H=nh(n),h=H[id];if(!t||!h)return null;let q=h.qty*Math.min(frac,1),k=quoteSell(t,q);
if(k.impact>.1){q*=.1/k.impact;k=quoteSell(t,q)}
const f=q/h.qty,mcAt=t.mc,full=f>=.97;h.qty-=q;h.cost*=1-f;if(full)delete H[id];
movePrice(t,k.move);noteTx(id,false,k.out);return {tr:n,type:full?'Sell':'Reduced',id,amt:k.out,at:mcAt,ak:'mc',note,ts:Date.now()}}
const nPnl=p=>{const t=DB[p.id];return(t.p/p.entry-1)*(p.side==='long'?1:-1)*p.lev};
function nPerp(n,t,margin,lev,side,note){if(NP[n]||!t||t.kind!=='perp')return null;lev=Math.min(lev,t.lev);NP[n]={id:t.id,side,lev,margin,entry:t.p,ts:Date.now()};
return {tr:n,type:'Opened',id:t.id,amt:margin*lev,at:t.p,ak:'px',lev,side,note,ts:Date.now()}}
function nPerpClose(n,note){const p=NP[n];if(!p)return null;const t=DB[p.id],liq=isLiq(p),v=liq?0:Math.max(0,p.margin*(1+nPnl(p))),pnl=v-p.margin;delete NP[n];
return {tr:n,type:liq?'Liquidated':'Closed',id:p.id,amt:p.margin*p.lev,at:t.p,ak:'px',lev:p.lev,side:p.side,pnl,pct:pnl/p.margin*100,note,ts:Date.now()}}
const LEAD=()=>[...new Set([...LBT.slice(0,6).map(x=>x[0]),...TN.slice().sort((a,b)=>TR[b].followers-TR[a].followers).slice(0,4)])].filter(l=>archOf(l)!=='copy');
const B={
/* buys memecoins at low MC, sells between $70K and $100K MC */
sniper(n){const H=nh(n);for(const id in H){const t=DB[id],h=H[id];if(t.mc>=70000+hash(n+id)%30001||(mins(h.ts)>8&&t.p<h.p0*.6)||mins(h.ts)>20)return nSell(n,id,1)}
if(nCount(n)>=3||Math.random()<.2)return null;const c=liveTok().filter(t=>t.mc>5000&&t.mc<40000&&!H[t.id]);return c.length?nBuy(n,pick(c),rnd(60,400)):null},
/* chases tokens that are already up, panic sells */
fomo(n){const H=nh(n);for(const id in H){const t=DB[id],h=H[id],r=t.p/h.p0;if(r<.85||(r>1.25&&Math.random()<.5)||mins(h.ts)>6)return nSell(n,id,1)}
if(nCount(n)>=2||Math.random()<.25)return null;const c=liveTok().filter(t=>!t.vf&&t.chg>25&&t.mc>=20000&&!H[t.id]).sort((a,b)=>b.chg-a.chg).slice(0,6);return c.length?nBuy(n,pick(c),rnd(150,1200)):null},
/* high leverage perps and random memecoins, wide sizing */
degen(n){if(NP[n]){const p=NP[n],r=nPnl(p);if(isLiq(p)||r>.3||r<-.35||mins(p.ts)>4)return nPerpClose(n)}
const H=nh(n);for(const id in H)if(mins(H[id].ts)>1+hash(n)%4&&Math.random()<.4)return nSell(n,id,1);
if(!NP[n]&&Math.random()<.45)return nPerp(n,pick(ALL.filter(x=>x.kind==='perp')),rnd(50,1500),pick([20,25,40,50]),Math.random()<.5?'long':'short');
if(nCount(n)>=3)return null;const c=liveTok().filter(t=>!H[t.id]&&t.mc<5e7);return c.length?nBuy(n,pick(c),Math.exp(rnd(Math.log(30),Math.log(2500)))):null},
/* very large size, majors only, small targets */
whale(n){if(NP[n]){const p=NP[n],r=nPnl(p);if(isLiq(p)||r>.12||r<-.08||mins(p.ts)>10)return nPerpClose(n)}
const H=nh(n);for(const id in H)if(mins(H[id].ts)>5+hash(n)%10||DB[id].p/H[id].p0>1.04)return nSell(n,id,1);
if(!NP[n]&&Math.random()<.5){const l=ALL.filter(x=>x.kind==='perp'&&/^(BTC|ETH|ANT|HYPE)$/.test(x.sym));return nPerp(n,pick(l),rnd(15000,120000),pick([3,5,10]),Math.random()<.6?'long':'short')}
const c=liveTok().filter(t=>t.mc0>=2e8&&!H[t.id]);return c.length&&nCount(n)<3?nBuy(n,pick(c),rnd(20000,250000)):null},
/* moderate size, low leverage, tight stops */
pro(n){if(NP[n]){const p=NP[n],r=nPnl(p);if(isLiq(p)||r>.15||r<-.1||mins(p.ts)>8)return nPerpClose(n)}
const H=nh(n);for(const id in H){const r=DB[id].p/H[id].p0;if(r>1.06||r<.96||mins(H[id].ts)>10)return nSell(n,id,1)}
if(!NP[n]&&Math.random()<.55){const t=pick(ALL.filter(x=>x.kind==='perp'));return nPerp(n,t,rnd(800,6000),pick([3,5,10]),t.chg+rnd(-6,6)>=0?'long':'short')}
const c=liveTok().filter(t=>t.vf&&t.mc0>=5e8&&!H[t.id]);return c.length&&nCount(n)<2?nBuy(n,pick(c),rnd(1000,8000)):null},
/* tiny tickets on small caps */
small(n){const H=nh(n);for(const id in H){const r=DB[id].p/H[id].p0;if(r>1.4||r<.7||mins(H[id].ts)>8)return nSell(n,id,1)}
if(nCount(n)>=2||Math.random()<.35)return null;const c=liveTok().filter(t=>!H[t.id]&&t.mc<8e6);return c.length?nBuy(n,pick(c),rnd(5,60)):null},
/* holds its own token: buys early, takes profit on pumps, sometimes dumps everything */
dev(n){const pool=liveTok().filter(t=>t.mc0<2e5&&!t.vf).sort((a,b)=>a.id<b.id?-1:1);if(!pool.length)return null;const t=pool[hash(n)%pool.length],h=nh(n)[t.id];
if(!h)return nBuy(n,t,rnd(300,1500),'Dev allocation');const r=t.p/h.p0;
if(r>=2.2)return nSell(n,t.id,1,'Dev sold the bag');if(r<.7&&mins(h.ts)>10)return nSell(n,t.id,1,'Cutting losses');if(r>=1.6&&Math.random()<.5)return nSell(n,t.id,.5,'Dev took profit');
return Math.random()<.06?nBuy(n,t,rnd(100,500),'Dev buyback'):null},
/* makes a call, the crowd piles in, then exits */
kol(n){const H=nh(n);for(const id in H)if(mins(H[id].ts)>1+hash(n+id)%3)return nSell(n,id,1,'KOL exit');
if(nCount(n)>=1||Math.random()<.4)return null;const c=liveTok().filter(t=>!t.vf&&t.mc>=15000&&t.mc<1.5e6);if(!c.length)return null;const t=pick(c),it=nBuy(n,t,rnd(800,5000),'KOL call');
if(it)for(let i=0,k=2+Math.floor(Math.random()*4);i<k;i++)CROWD.push({at:Date.now()+rnd(4,45)*1e3,id:t.id});return it},
/* mirrors leaderboard and high-follower traders */
copy(n){const H=nh(n);for(const id in H)if(mins(H[id].ts)>12)return nSell(n,id,1);if(NP[n]&&mins(NP[n].ts)>10)return nPerpClose(n);
const L=LEAD(),C=NC[n]||(NC[n]=new Set()),now=Date.now(),f=FEED.find(x=>L.includes(x.tr)&&!x.me&&now-x.ts>2000&&now-x.ts<9e4&&!C.has(x.tr+x.ts));if(!f)return null;
C.add(f.tr+f.ts);if(C.size>50)C.delete(C.values().next().value);if(Math.random()>.35)return null;const t=DB[f.id];if(!t||t.dead)return null;const note='Copying '+f.tr;
if(f.type==='Buy'&&t.kind==='token')return nBuy(n,t,Math.min(f.amt*.2,rnd(100,2000)),note);
if(f.type==='Opened'&&f.lev)return nPerp(n,t,Math.max(20,Math.min(f.amt/f.lev*.2,2000)),f.lev,f.side,note);
if(f.type==='Sell'||f.type==='Reduced')return H[f.id]?nSell(n,f.id,f.type==='Sell'?1:.5,note):null;
if((f.type==='Closed'||f.type==='Liquidated')&&NP[n]&&NP[n].id===f.id)return nPerpClose(n,note);return null}};
function pickN(f){let tot=0;const c=TN.filter(f).map(n=>[n,tot+=ARCH[archOf(n)].rate]),x=Math.random()*tot;return (c.find(e=>e[1]>=x)||c[c.length-1]||[])[0]}
function npcStep(){const out=[],now=Date.now();
for(let i=CROWD.length-1;i>=0;i--)if(CROWD[i].at<=now){const c=CROWD.splice(i,1)[0],t=DB[c.id],n=pickN(x=>/^(fomo|small)$/.test(archOf(x))),it=n&&t&&nBuy(n,t,archOf(n)==='fomo'?rnd(150,900):rnd(10,80),'Following the KOL call');if(it)out.push(it)}
let it=null;for(let k=0;k<12&&!it;k++){const n=pickN(()=>true);it=B[archOf(n)](n)}
if(it)out.push(it);return out}
function feedTick(){const its=npcStep(),it=its[0];for(const x of its){FEED.unshift(x);followAlert(x)}while(FEED.length>80)FEED.pop();
if(it&&/feed/.test(location.hash)&&window.scrollY<120&&$('#feedList')&&!UI.fHidden.includes(it.type)&&(!UI.fFol||S.follows.includes(it.tr)))$('#feedList').innerHTML=feedList()}
function notifTick(){if(!S.nt.enable||S.nt.pause||!S.nt.trending)return;const t=pick(ALL.filter(x=>x.kind==='token'&&!x.dead));S.notifs.unshift({t:`Trending: ${t.sym} is being traded by ${Math.floor(rnd(6,40))} users`,ts:Date.now(),u:1});S.notifs=S.notifs.slice(0,20);save();if(/home|^$/.test(location.hash.replace(/^#\/?/,'')||'home')&&!$('#ov'))render(true)}
/* ---------- boot ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act],[data-go]');if(!el)return;if(el.dataset.go){closeSheet();buzz();go(el.dataset.go);return}const f=ACT[el.dataset.act];if(f){if(!['closeSheet','follow','rmRec'].includes(el.dataset.act))buzz();f(el,e)}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='tamt'&&UI.tr){UI.tr.amt=t.value;$('#est1').textContent=estTxt(DB[UI.tr.id],UI.tr,parseNum(t.value)||0)}if(t.id==='lev'&&UI.tr){UI.tr.lev=+t.value;$('#levv').textContent=t.value+'x';$('#est1').textContent=estTxt(DB[UI.tr.id],UI.tr,parseNum(UI.tr.amt)||0);const b=$('.cta');if(b&&UI.tr.mode==='buy')b.textContent=`Open ${UI.tr.lev}x ${UI.tr.side==='long'?'Long':'Short'}`}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.id==='amtin'){$('.cta')?.click()}});
window.addEventListener('hashchange',()=>{closeSheet();UI.qt=false;render()});
seedFeed();
const NAV=[['home','home'],['search','search'],['feed','link'],['leaderboard','crown'],['profile','user']];
const navIcon=(k,i)=>k==='profile'?`<img class="av" src="${S.user.avatar||IMG.AVATAR}" alt="">`:I(i,22);
$('#app').innerHTML=`<aside class="side"><div class="brand"><img src="${IMG.LOGO}" alt="">${BRAND}</div>${NAV.map(([k,i])=>`<button class="navb" data-nav="${k}" data-go="${k}">${navIcon(k,i)}<span>${t_(k==='leaderboard'?'lb':k)}</span></button>`).join('')}<div class="sp"></div><div class="mini"><div class="l">Balance</div><div class="v" data-total></div><button class="btn pri sm" style="width:100%" data-act="deposit">${t_('deposit')}</button></div></aside><main id="main"></main><aside class="rail" id="rail"></aside>`;
const dock=document.createElement('nav');dock.className='dock';dock.innerHTML=NAV.map(([k,i])=>`<button data-nav="${k}" data-go="${k}" aria-label="${k}">${navIcon(k,i)}</button>`).join('');document.body.appendChild(dock);
if(!location.hash)history.replaceState(null,'','#/home');
if(!S.loggedIn)showLogin();
render();
setInterval(tick,1500);setInterval(feedTick,3200);setInterval(notifTick,45000);
window.__apex={S,DB,UI,go,ACT,npc:{AR,ARCH,step:npcStep,FEED}};
